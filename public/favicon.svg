<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="url(#glowGrad)" stroke-width="1.5" fill="none"/>
  
  <!-- Modern Percentage & Calculator Symbol -->
  <g fill="#ffffff">
    <!-- Top-left Circle -->
    <circle cx="23" cy="23" r="5" fill="#ffffff" />
    <!-- Bottom-right Circle -->
    <circle cx="41" cy="41" r="5" fill="#ffffff" />
    <!-- Diagonal Slash Bar -->
    <path d="M43 19.5 C43.8 18.7 43.8 17.3 43 16.5 C42.2 15.7 40.8 15.7 40 16.5 L20.5 44 C19.7 44.8 19.7 46.2 20.5 47 C21.3 47.8 22.7 47.8 23.5 47 L43 19.5 Z" fill="#ffffff" />
    
    <!-- Precision Dot Accents -->
    <circle cx="32" cy="14" r="1.5" fill="#a7f3d0" />
    <circle cx="50" cy="32" r="1.5" fill="#a7f3d0" />
    <circle cx="14" cy="32" r="1.5" fill="#a7f3d0" />
    <circle cx="32" cy="50" r="1.5" fill="#a7f3d0" />
  </g>
</svg>
